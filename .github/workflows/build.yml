name: Build and test Low Consuming Chrome
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Compile and test Chrome patcher
        shell: powershell
        run: ./scripts/Build.ps1 -Product Chrome
      - name: Package sources and executable
        shell: powershell
        run: ./scripts/Package.ps1 -OutputPath "$env:RUNNER_TEMP/low-consuming-chrome-v0.5.0-experimental.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: low-consuming-chrome-Windows
          path: ${{ runner.temp }}/low-consuming-chrome-v0.5.0-experimental.zip
          if-no-files-found: error